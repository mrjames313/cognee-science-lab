[project]
name = "cognee-science-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cognee>=1.6,<1.7",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>0.12,<0.13"]
build_backend = "uv_build"

[tool.uv.build-backend]
module-name = "cognee_lab"
module-root = "src"

[tool.uv.extra-build-dependencies]
cognee-science-lab = ["setuptools"]
