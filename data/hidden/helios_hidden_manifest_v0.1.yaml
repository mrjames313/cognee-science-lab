entity_resolution_policy_notes:
- 'Surface form alone is insufficient: ''the controller'' maps to S001 or S003 depending on local discourse.'
- Pronouns are scored only for selected probes, not every pronoun in the documents.
- Generic uses should not be globally canonicalized. The manifest records particular mention-in-context resolutions.
- The alias 'Aurora' is intentionally ambiguous between O001 and SW001.
