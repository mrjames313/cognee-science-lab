evaluation_notes:
  provenance: Repeated facts in DOC01 and DOC02 should retain document-level provenance rather than collapsing source
    identity.
  temporal_scope: The 1.20 MA limit is valid for Campaign A / DOC01 date, not an eternal device property.
  measurement_vs_property: 1.20 ± 0.02 MA belongs to shot H1-1854 under a particular calibration state.
  negative_knowledge: Explicit statements that Campaign A does not establish a fundamental limit or confinement
    improvement should not be inverted into positive claims.
  capacity_vs_usage: 8 MW NBI installed capacity and 6 MW H1-1854 operating power are different predicates.
